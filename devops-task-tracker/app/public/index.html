<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps Task Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; }
    li { display: flex; justify-content: space-between; padding: 6px 0; cursor: pointer; }
    li.done span { text-decoration: line-through; opacity: .5; }
  </style>
</head>
<body>
  <h1>Task Tracker</h1>
  <form id="form">
    <input id="title" placeholder="New task..." required />
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <script>
    const list = document.getElementById('list');
    async function load() {
      const tasks = await (await fetch('/api/tasks')).json();
      list.innerHTML = '';
      tasks.forEach((t) => {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';
        const span = document.createElement('span');
        span.textContent = t.title;
        span.onclick = async () => { await fetch(`/api/tasks/${t._id}/toggle`, { method: 'PATCH' }); load(); };
        const del = document.createElement('button');
        del.textContent = 'x';
        del.onclick = async () => { await fetch(`/api/tasks/${t._id}`, { method: 'DELETE' }); load(); };
        li.append(span, del);
        list.append(li);
      });
    }
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('title');
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value }),
      });
      input.value = '';
      load();
    };
    load();
  </script>
</body>
</html>
